services:
  - type: web
    name: speech-guru-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: speech_guru
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: COOKIE_SECURE
        value: "1"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "10000"
      - key: APP_URL
        sync: false
      - key: PASSWORD_RESET_DELIVERY
        value: "none"
      - key: PRIVACY_CONTACT_URL
        value: "https://github.com/pushkarverse/orcter/issues"
      - key: ENABLE_DOCS
        value: "0"
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
