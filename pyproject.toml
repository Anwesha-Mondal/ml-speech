[project]
name = "speech-arena"
version = "0.1.0"
description = "Contrastive Speech Analytics & Temporal Flaw Grounding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pymongo>=4.10",
    "redis>=5.2",
    "python-dotenv>=1.0",
    "uvicorn>=0.29.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "librosa>=0.10.1",
    "praat-parselmouth>=0.4.3",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "jinja2>=3.1.3",
    "soundfile>=0.12.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "transformers>=5.19.0",
    "datasets>=5.1.0",
    "tensorboard>=2.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mongomock>=4.3",
    "fakeredis>=2.26",
    "types-pyyaml>=6.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
strict = true
